<style>
  .gps-bloco { background: white; border: 1px solid #c8d5d9; border-radius: .5rem; padding: 1rem; margin: 1rem 0; }
  .gps-grade { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); }
  .gps-grade label { display: grid; gap: .3rem; min-width: 0; }
  .gps-grade select, .gps-grade input { min-width: 0; width: 100%; }
  textarea, input { color: inherit; font: inherit; padding: .5rem; width: 100%; box-sizing: border-box; }
  .gps-mapa-area { position: relative; max-width: 46rem; }
  #gps-mapa { display: block; width: 100%; background: #edf4f2; }
  #gps-previa { position: absolute; inset-inline-end: .5rem; inset-block-end: .5rem; max-width: calc(100% - 1rem);
    padding: .55rem .75rem; border: 1px solid var(--borda); border-radius: .45rem; background: white;
    box-shadow: 0 2px 8px #083d4326; pointer-events: none; }
  #gps-previa-atividade, #gps-previa-contexto { display: block; font-size: .875rem; }
  #gps-mapa circle { cursor: pointer; }
  #gps-calor { max-height: 22rem; overflow: auto; }
  .gps-barra { height: .4rem; width: 9rem; }
  dialog { color: inherit; max-width: min(34rem, 90vw); }
</style>
<section class="gps-bloco" data-pagina="territorio" hidden>
  <h2>Acompanhamento territorial</h2>
  <form id="gps-filtros" class="gps-grade">
    <label>Escola<select name="escola_id"></select></label>
    <label>Município<select name="municipio_id"></select></label>
    <label>PEC<select name="pec_id"></select></label>
    <label>Pasta<select name="pasta_id"></select></label>
    <label>De<input name="inicio" type="date" required></label>
    <label>Até<input name="fim" type="date" required></label>
    <label>Atividade<select name="tipo"><option value="">Todas</option><option value="visita">Visitas</option><option value="apoio">Apoios</option></select></label>
    <label>Camada<select name="camada"><option value="atividades">Acompanhamentos</option><option value="visitas">Visitas</option><option value="apoios">Apoios</option><option value="calor">Mapa de calor</option><option value="frequencia">Cobertura de frequência</option><option value="avaliacoes">Cobertura de avaliações</option><option value="plataformas">Cobertura de plataformas</option><option value="prioridades">Prioridades</option></select></label>
    <label>Agrupamento<select name="granularidade"><option value="semanal">Semana</option><option value="quinzenal">Quinzena</option><option value="mensal" selected>Mês</option><option value="ano">Ano</option></select></label>
    <button>Aplicar filtros</button>
  </form>
  <p id="gps-territorio-estado" role="status"></p>
  <p id="gps-mapa-modo">Carregando cartografia…</p>
  <p id="gps-mapa-legenda"></p>
  <button type="button" id="gps-zoom-mais" hidden>Aproximar</button>
  <button type="button" id="gps-zoom-menos" hidden>Afastar</button>
  <button type="button" id="gps-zoom-restaurar" hidden>Ver território inteiro</button>
  <div class="gps-mapa-area">
    <svg id="gps-mapa" viewBox="0 0 600 320" aria-label="Mapa esquemático sem limites geográficos"></svg>
    <div id="gps-previa" role="tooltip" hidden>
      <strong id="gps-previa-nome"></strong>
      <span id="gps-previa-atividade"></span>
      <span id="gps-previa-contexto"></span>
    </div>
  </div>
  <p id="gps-mapa-estado" role="status"></p>
  <aside id="gps-ficha" class="gps-bloco" hidden>
    <h3 id="gps-ficha-nome"></h3>
    <p id="gps-ficha-atividade"></p>
    <button id="gps-ficha-integral" type="button">Abrir ficha integral</button>
  </aside>
  <div class="tabela"><table aria-label="Gráfico por período"><tbody id="gps-grafico"></tbody></table></div>
  <details><summary>Mapa de calor temporal por escola</summary>
    <div id="gps-calor" class="tabela"><table aria-label="Calor temporal"><tbody id="gps-heat"></tbody></table></div>
  </details>
</section>
<section data-pagina="registros" hidden>
<div class="gps-bloco" id="gps-atuacao" hidden>
  <h2>Registrar atuação</h2>
  <details data-formulario="plano"><summary>Plano de Trabalho</summary>
    <form id="gps-plano" class="gps-grade">
      <label>Escola<select name="escola_id" required></select></label>
      <label>Pasta<select name="pasta_id" required></select></label>
      <label>Componente<select name="componente_id" required></select></label>
      <label>Turma<select name="turma_id"></select></label>
      <label>Data<input name="data" type="date" required></label>
      <label>Período informado<select name="periodo_dia"><option value="">Sem período</option><option>manhã</option><option>tarde</option></select></label>
      <label>Atividade<select name="tipo"><option value="visita">Visita</option><option value="apoio">Apoio presencial</option></select></label>
      <label>Objetivo pedagógico<textarea name="objetivo" maxlength="1000" required></textarea></label>
      <button type="button" id="gps-verificar">Verificar prioridades</button>
      <button>Salvar atividade</button>
    </form>
    <p id="gps-plano-estado" role="status"></p>
  </details>
  <details data-formulario="decisao"><summary>Justificar visita com termo pendente</summary>
    <form id="gps-decisao" class="gps-grade">
      <label>Visita<select name="visita_id" required></select></label>
      <label>Motivo se a visita não ocorreu<textarea name="motivo" maxlength="1000"></textarea></label>
      <button name="decisao" value="termo_atrasado">Termo em atraso</button>
      <button name="decisao" value="nao_ocorreu">A visita não ocorreu</button>
    </form>
    <p id="gps-decisao-estado" role="status"></p>
  </details>
  <details data-formulario="termo"><summary>Termo ou ficha de visita</summary>
    <form id="gps-termo" class="gps-grade">
      <label>Visita<select name="visita_id" required></select></label>
      <label>Tipo<select name="tipo"><option value="termo_visita">Termo</option><option value="ficha_visita">Ficha</option></select></label>
      <label>Evidência pedagógica<textarea name="observacao" maxlength="1000" required></textarea></label>
      <button>Registrar evidência</button>
    </form>
    <p id="gps-termo-estado" role="status"></p>
  </details>
</div>
<div class="gps-bloco">
  <h2>Registros e alertas</h2>
  <p id="gps-registros-estado" role="status">Verificando permissões de registro…</p>
  <p id="gps-central-estado" role="status">Carregando seus alertas…</p>
  <button id="gps-abrir-alertas" type="button" hidden>Ver meus alertas</button>
  <button id="gps-alertas-gerais" type="button" hidden>Consultar todos os alertas</button>
</div>
</section>
  <dialog id="gps-alertas">
    <h2>Avisos de acompanhamento</h2>
    <form id="gps-justificar" class="gps-grade">
      <label>Alerta<select name="id" required></select></label>
      <label>Justificativa<textarea name="motivo" required maxlength="1000"></textarea></label>
      <button>Registrar justificativa</button>
      <button type="button" id="gps-fechar-alertas">Fechar</button>
    </form>
    <p id="gps-alerta-estado" role="status"></p>
  </dialog>
<script>
(() => {
  const el = id => document.getElementById(id);
  const formData = form => Object.fromEntries(new FormData(form));
  const filtros = el('gps-filtros');
  const plano = el('gps-plano');
  const termo = el('gps-termo');
  const decisao = el('gps-decisao');
  const justificativa = el('gps-justificar');
  const dialogo = el('gps-alertas');
  let numeroConsulta = 0;
  let resumoInicial = true;
  let cartografia;
  let ultimosDados;
  let zoom = 1;
  const previas = new Map();
  const coresMunicipais = ['#087b73','#418653','#9054a4','#477cb0','#bd586f','#b56c35'];
  const nsMapa = 'http://www.w3.org/2000/svg';
  const normalizarMapa = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  function svgMapa(tipo, atributos) {
    const item = document.createElementNS(nsMapa, tipo);
    for (const [chave, valor] of Object.entries(atributos)) item.setAttribute(chave, valor);
    return item;
  }
  function ajustarZoom() {
    const largura = 600 / zoom;
    const altura = 320 / zoom;
    el('gps-mapa').setAttribute('viewBox', [(600 - largura) / 2, (320 - altura) / 2, largura, altura].join(' '));
  }
  for (const [id, fator] of [['gps-zoom-mais', 1.4], ['gps-zoom-menos', 1/1.4], ['gps-zoom-restaurar', 0]]) {
    el(id).addEventListener('click', () => {
      zoom = fator ? Math.min(6, Math.max(1, zoom * fator)) : 1;
      ajustarZoom();
    });
  }
  document.addEventListener('gps:modulo', ({detail}) => {
    if (detail.alvo !== 'territorio' || cartografia) return;
    cartografia = { modo: 'pendente', motivo: 'Consultando cartografia…' };
    rpc('gpsCartografia', [], dados => {
      cartografia = dados;
      if (ultimosDados) renderizar(ultimosDados);
    }, 'gps-mapa-modo');
  });
  function rpc(nome, argumentos, sucesso, estado) {
    google.script.run.withSuccessHandler(sucesso).withFailureHandler(erro => {
      if (estado) el(estado).textContent = erro.message || 'Operação indisponível.';
    })[nome](...argumentos);
  }
  function preencher(select, itens, todos) {
    select.replaceChildren(new Option(todos, ''), ...itens.map(r => new Option(r.nome, r.id)));
  }
  function linha(destino, valores) {
    const tr = destino.insertRow();
    for (const valor of valores) tr.insertCell().textContent = valor;
    return tr;
  }
  function textoAtividades(escola) {
    return `${escola.previstas || 0} previstas · ${escola.contabilizadas || 0} contabilizadas · ${escola.comprovadas || 0} comprovadas`;
  }

  function renderizar(dados) {
    ultimosDados = dados;
    const { resumo, pontos, periodos, calor } = dados;
    if (resumoInicial) {
      el('gps-total-escolas').textContent = pontos.length;
      for (const campo of ['previstas', 'contabilizadas', 'comprovadas']) el('gps-total-' + campo).textContent = resumo[campo];
      resumoInicial = false;
    }
    el('gps-territorio-estado').textContent =
      `${resumo.previstas} previstas · ${resumo.contabilizadas} contabilizadas · ${resumo.comprovadas} comprovadas`;
    const ficha = pontos.find(p => p.id === filtros.elements.escola_id.value);
    el('gps-ficha').hidden = !ficha;
    if (ficha) {
      el('gps-ficha-nome').textContent = ficha.nome;
      el('gps-ficha-atividade').textContent = textoAtividades(ficha);
      el('gps-ficha-integral').onclick = () => window.gpsAbrirFicha(ficha.id, ficha.nome);
    }
    const mapa = el('gps-mapa');
    mapa.replaceChildren();
    const previa = el('gps-previa');
    previa.hidden = true;
    let pontoComPrevia;
    let temporizadorPrevia;
    const geografico = cartografia?.modo === 'geografico';
    const esquematico = cartografia?.modo === 'esquematico';
    const locais = geografico || esquematico
      ? pontos.filter(p => Number.isFinite(p.latitude) && Number.isFinite(p.longitude)) : [];
    el('gps-mapa-modo').textContent = geografico ? 'Divisas: ' + cartografia.fonte +
      (cartografia.sede ? '' : ' · Sede da URE aguarda coordenadas verificadas.') :
      cartografia?.motivo || 'Carregando cartografia…';
    mapa.setAttribute('aria-label', geografico ? 'Mapa territorial com divisas municipais' : 'Mapa esquemático sem limites geográficos');
    el('gps-mapa-estado').textContent = locais.length + ' de ' + pontos.length + ' escolas exibidas no mapa';
    const divisas = geografico ? cartografia.divisas : [];
    const coordenadas = divisas.flatMap(d => d.poligonos.flat(2));
    for (const p of locais) coordenadas.push([p.longitude, p.latitude]);
    if (geografico && cartografia.sede) coordenadas.push([cartografia.sede[1], cartografia.sede[0]]);
    let o = Infinity, l = -Infinity, s = Infinity, n = -Infinity;
    for (const [lon, lat] of coordenadas) {
      o = Math.min(o, lon); l = Math.max(l, lon); s = Math.min(s, lat); n = Math.max(n, lat);
    }
    const cos = geografico ? Math.cos((n + s) / 2 * Math.PI / 180) : 1;
    const escala = Math.min(560 / Math.max((l - o) * cos, .0001), 280 / Math.max(n - s, .0001));
    const xy = ([lon, lat]) => [300 + (lon - (o + l) / 2) * cos * escala, 160 - (lat - (n + s) / 2) * escala];
    for (const d of divisas) {
      const path = d.poligonos.flatMap(p => p.map(anel => 'M' + anel.map(pos => xy(pos).join(',')).join('L') + 'Z')).join('');
      const area = svgMapa('path', { d:path, fill:coresMunicipais[d.cor], stroke:coresMunicipais[d.cor],
        'fill-opacity':.18, 'fill-rule':'evenodd', 'stroke-width':1.2 });
      const titulo = svgMapa('title', {}); titulo.textContent = d.nome; area.append(titulo); mapa.append(area);
    }
    const legendaDivisas = divisas.map(d => d.nome).join(' · ');
    el('gps-mapa-legenda').textContent = legendaDivisas;
    if (geografico && cartografia.sede) {
      const [x,y] = xy([cartografia.sede[1], cartografia.sede[0]]);
      const sede = svgMapa('rect', { x:x-6,y:y-6,width:12,height:12,fill:'#f4c649',stroke:'#083d43',transform:'rotate(45 '+x+' '+y+')' });
      const titulo = svgMapa('title', {}); titulo.textContent = 'Sede da URE'; sede.append(titulo); mapa.append(sede);
    }
    for (const id of ['gps-zoom-mais','gps-zoom-menos','gps-zoom-restaurar']) el(id).hidden = !geografico;
    ajustarZoom();
    const camada = dados.camada || 'atividades';
    const intensidade = p => ['atividades','calor'].includes(camada) ? p.contabilizadas :
      ['visitas','apoios'].includes(camada) ? p[camada] || 0 : p.cobertura || 0;
    const maximo = Math.max(1, ...locais.map(intensidade));
    for (const p of locais) {
      const [x,y] = xy([p.longitude, p.latitude]);
      const valor = intensidade(p);
      if (camada === 'calor' && valor) mapa.append(svgMapa('circle', {
        cx:x,cy:y,r:10+22*valor/maximo,fill:'#e5792b',opacity:.2,'pointer-events':'none'
      }));
      const cor = divisas.find(d => d.chave === normalizarMapa(p.municipio))?.cor;
      const ponto = svgMapa('circle', { cx:x, cy:y, r:5+9*valor/maximo,
        fill: valor ? (coresMunicipais[cor] || '#087b73') : '#526a76', stroke:'#fff','stroke-width':1 });
      ponto.setAttribute('tabindex', '0');
      ponto.setAttribute('role', 'button');
      ponto.setAttribute('aria-label', p.nome);
      const ocultarPrevia = () => {
        if (pontoComPrevia !== ponto) return;
        clearTimeout(temporizadorPrevia);
        previa.hidden = true;
        ponto.removeAttribute('aria-describedby');
        pontoComPrevia = null;
      };
      const abrirPrevia = () => {
        pontoComPrevia?.removeAttribute('aria-describedby');
        pontoComPrevia = ponto;
        clearTimeout(temporizadorPrevia);
        const contexto = el('gps-previa-contexto');
        contexto.textContent = '';
        const inicio = filtros.elements.inicio.value;
        const fim = filtros.elements.fim.value;
        const chave = JSON.stringify([p.id, inicio, fim]);
        const mostrar = resumo => {
          if (pontoComPrevia !== ponto || !ponto.isConnected) return;
          const r = resumo.visita;
          const trechos = [];
          if (r) trechos.push('Visita: ' + [r.data, r.situacao, r.termo].filter(Boolean).join(' · '));
          if (resumo.frequencia) trechos.push('Frequência: ' + resumo.frequencia);
          if (resumo.provaPaulista) trechos.push('Prova Paulista: ' + resumo.provaPaulista);
          if (resumo.saresp) trechos.push('SARESP: ' + resumo.saresp.texto);
          contexto.textContent = trechos.join(' | ');
        };
        if (previas.has(chave)) mostrar(previas.get(chave));
        else temporizadorPrevia = setTimeout(() => {
          if (!ponto.isConnected) return;
          rpc('gpsResumoMapaEscola', [p.id,inicio,fim], resumo => {
            if (previas.size >= 120) previas.clear();
            previas.set(chave, resumo);
            mostrar(resumo);
          });
        }, 300);
        el('gps-previa-nome').textContent = p.nome;
        el('gps-previa-atividade').textContent = textoAtividades(p) +
          (p.cobertura != null ? ' · ' + p.cobertura + ' registros na camada' : '');
        previa.hidden = false;
        ponto.setAttribute('aria-describedby', 'gps-previa');
      };
      ponto.addEventListener('mouseenter', abrirPrevia);
      ponto.addEventListener('mouseleave', ocultarPrevia);
      ponto.addEventListener('focus', abrirPrevia);
      ponto.addEventListener('blur', ocultarPrevia);
      const selecionar = () => {
        ocultarPrevia();
        filtros.elements.escola_id.value = p.id;
        consultar();
        window.gpsAbrirFicha(p.id, p.nome);
      };
      ponto.addEventListener('click', selecionar);
      ponto.addEventListener('keydown', evento => {
        if (evento.key === 'Escape') ocultarPrevia();
        if (['Enter', ' '].includes(evento.key)) {
          evento.preventDefault();
          selecionar();
        }
      });
      mapa.append(ponto);
    }
    const grafico = el('gps-grafico');
    grafico.replaceChildren();
    linha(grafico, ['Período', 'Previstas', 'Contabilizadas', 'Comprovadas']);
    const pico = Math.max(1, ...periodos.map(p => p.previstas));
    for (const p of periodos) {
      const tr = linha(grafico, [p.periodo]);
      for (const campo of ['previstas', 'contabilizadas', 'comprovadas']) {
        const celula = tr.insertCell();
        const barra = document.createElement('progress');
        barra.className = 'gps-barra';
        barra.value = p[campo]; barra.max = pico;
        barra.setAttribute('aria-label', campo);
        celula.append(document.createTextNode(p[campo] + ' '), barra);
      }
    }
    const heat = el('gps-heat');
    heat.replaceChildren();
    linha(heat, ['Escola', 'Período', 'Previstas', 'Contabilizadas', 'Comprovadas']);
    const nomes = new Map(pontos.map(r => [r.id, r.nome]));
    const maximoCalor = Math.max(1, ...calor.map(r => r.contabilizadas));
    for (const p of calor) {
      const tr = linha(heat, [nomes.get(p.escola_id), p.periodo, p.previstas, p.contabilizadas, p.comprovadas]);
      tr.cells[3].style.backgroundColor = `rgba(8, 123, 115, ${.65 * p.contabilizadas / maximoCalor})`;
    }
  }
  function consultar() {
    const atual = ++numeroConsulta;
    rpc('gpsDadosTerritorio', [formData(filtros)], dados => { if (atual === numeroConsulta) renderizar(dados); }, 'gps-territorio-estado');
  }
  filtros.addEventListener('submit', evt => { evt.preventDefault(); consultar(); });
  rpc('gpsOpcoesTerritorio', [], dados => {
    for (const [campo, itens] of Object.entries({ escola_id: dados.escolas, municipio_id: dados.municipios, pec_id: dados.pecs, pasta_id: dados.pastas })) {
      preencher(filtros.elements[campo], itens, 'Todos');
    }
    if (!dados.camadasPedagogicas) {
      for (const valor of ['frequencia','avaliacoes','plataformas','prioridades']) filtros.elements.camada.querySelector('[value='+valor+']').hidden = true;
    }
    filtros.elements.inicio.value = dados.hoje.slice(0, 4) + '-01-01';
    filtros.elements.fim.value = dados.hoje.slice(0, 4) + '-12-31';
    consultar();
  }, 'gps-territorio-estado');

  rpc('gpsMinhasOpcoes', [], dados => {
    el('gps-revisar').hidden = dados.papel !== 'CEC';
    el('gps-atuacao').hidden = !dados.escolas.length;
    el('gps-alertas-gerais').hidden = dados.papel !== 'CEC';
    el('gps-registros-estado').textContent = dados.escolas.length ? 'Selecione um formulário para registrar uma atividade.' :
      dados.papel === 'CEC' ? 'Acompanhe os alertas gerais. Formulários de atividade exigem atribuição PEC.' :
      'Nenhuma escola atribuída para registrar atividades.';
    preencher(plano.elements.escola_id, dados.escolas, 'Selecione');
    preencher(plano.elements.pasta_id, dados.pastas, 'Selecione');
    preencher(plano.elements.componente_id, dados.componentes, 'Selecione');
    preencher(termo.elements.visita_id, dados.visitas, 'Selecione');
    preencher(decisao.elements.visita_id, dados.visitas, 'Selecione');
    const atualizarTurmas = () => preencher(plano.elements.turma_id,
      dados.turmas.filter(r => r.escola_id === plano.elements.escola_id.value), 'Sem turma');
    atualizarTurmas();
    plano.elements.escola_id.addEventListener('change', atualizarTurmas);
  }, 'gps-registros-estado');
  el('gps-verificar').addEventListener('click', () => rpc('gpsAvisosFormulario', [formData(plano)], avisos => {
    el('gps-plano-estado').textContent = `${avisos.alinhadas} de ${avisos.prioridades} prioridades da escola contempladas.`;
  }, 'gps-plano-estado'));
  termo.elements.visita_id.addEventListener('change', () => {
    if (!termo.elements.visita_id.value) return;
    rpc('gpsContextoTermo', [termo.elements.visita_id.value], avisos => {
      el('gps-termo-estado').textContent = `${avisos.divergencias} prioridades da escola fora do escopo desta visita.`;
    }, 'gps-termo-estado');
  });
  for (const [form, metodo, estado] of [[plano, 'gpsSalvarPlano', 'gps-plano-estado'], [termo, 'gpsSalvarTermo', 'gps-termo-estado']]) {
    form.addEventListener('submit', evt => {
      evt.preventDefault();
      rpc(metodo, [formData(form)], () => { el(estado).textContent = 'Registro salvo.'; }, estado);
    });
  }
  decisao.addEventListener('submit', evt => {
    evt.preventDefault();
    const dados = { ...formData(decisao), decisao: evt.submitter?.value };
    if (!window.confirm('Confirma o registro desta decisão para a visita?')) return;
    rpc('gpsRegistrarDecisaoVisita', [dados], () => {
      el('gps-decisao-estado').textContent = 'Decisão registrada. A atualização do painel pode levar até 30 segundos.';
    }, 'gps-decisao-estado');
  });
  function alertas(abrir) {
    rpc('gpsMeusAlertas', [], itens => {
      preencher(justificativa.elements.id, itens.map(r => ({ id: r.id, nome: r.tipo.replaceAll('_', ' ') + ' · ' + r.periodo })), 'Selecione');
      el('gps-abrir-alertas').hidden = !itens.length;
      el('gps-central-estado').textContent = itens.length ? 'Há alertas pessoais em aberto.' : 'Nenhum alerta pessoal em aberto.';
      if (itens.length && abrir && !dialogo.open) dialogo.showModal();
      if (!itens.length && dialogo.open) dialogo.close();
    }, 'gps-central-estado');
  }
  el('gps-abrir-alertas').addEventListener('click', () => alertas(true));
  el('gps-fechar-alertas').addEventListener('click', () => dialogo.close());
  justificativa.addEventListener('submit', evt => {
    evt.preventDefault();
    rpc('gpsJustificarAlerta', [formData(justificativa)], () => {
      justificativa.reset();
      el('gps-alerta-estado').textContent = 'Justificativa registrada.';
      alertas(false);
    }, 'gps-alerta-estado');
  });
  el('gps-form-revisar').addEventListener('submit', evt => {
    evt.preventDefault();
    const dados = formData(evt.currentTarget);
    rpc('gpsRevisarIndicador', [{ id: dados.id, valor: dados.valor === '' ? null : Number(dados.valor) }], () => {
      el('gps-revisao-estado').textContent = 'Indicador validado.';
    }, 'gps-revisao-estado');
  });
  let jaAbriu = false;
  try { jaAbriu = sessionStorage.getItem('gps-alertas-abertos') === 'true'; } catch {}
  alertas(!jaAbriu);
  dialogo.addEventListener('close', () => {
    try { sessionStorage.setItem('gps-alertas-abertos', 'true'); } catch {}
  });
})();
</script>
